<div class="form-container">
  <!-- En-tête -->
  <div class="form-header">
    <h1>{{ isEditMode ? 'Modifier la matière' : 'Ajouter une matière' }}</h1>
  </div>

  <!-- Messages -->
  <div class="message success" *ngIf="success">
    {{ success }}
    <button class="close-btn" (click)="success = ''">×</button>
  </div>

  <div class="message error" *ngIf="error">
    {{ error }}
    <button class="close-btn" (click)="error = ''">×</button>
  </div>

  <!-- Formulaire -->
  <form [formGroup]="matiereForm" (ngSubmit)="onSubmit()" class="matiere-form">
    <!-- Nom de la matière -->
    <div class="form-group">
      <label for="nom">Nom de la matière *</label>
      <input 
        type="text" 
        id="nom" 
        formControlName="nom"
        placeholder="Ex: Mathématiques, Français, Histoire..."
        maxlength="100">
      <div class="error-message" *ngIf="isFieldInvalid('nom')">
        {{ getErrorMessage('nom') }}
      </div>
    </div>

    <!-- Niveau -->
    <div class="form-group">
      <label for="niveau">Niveau *</label>
      <select id="niveau" formControlName="niveau">
        <option value="">Sélectionner un niveau</option>
        <option *ngFor="let niveau of niveaux" [value]="niveau">
          {{ niveau }}
        </option>
      </select>
      <div class="error-message" *ngIf="isFieldInvalid('niveau')">
        {{ getErrorMessage('niveau') }}
      </div>
    </div>

    <!-- Coefficient -->
    <div class="form-group">
      <label for="coefficient">Coefficient *</label>
      <input 
        type="number" 
        id="coefficient" 
        formControlName="coefficient"
        placeholder="1.0"
        step="0.1"
        min="0.1"
        max="10">
      <div class="error-message" *ngIf="isFieldInvalid('coefficient')">
        {{ getErrorMessage('coefficient') }}
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea 
        id="description" 
        formControlName="description"
        rows="4"
        placeholder="Description optionnelle de la matière..."
        maxlength="1000"></textarea>
      <div class="error-message" *ngIf="isFieldInvalid('description')">
        {{ getErrorMessage('description') }}
      </div>
    </div>

    <!-- Boutons d'action -->
    <div class="form-actions">
      <button type="button" class="btn-annuler" (click)="cancel()">
        Annuler
      </button>
      <button type="submit" class="btn-ajouter" [disabled]="!canSubmit()">
        {{ isEditMode ? 'Modifier' : 'Ajouter' }}
      </button>
    </div>
  </form>
</div>
