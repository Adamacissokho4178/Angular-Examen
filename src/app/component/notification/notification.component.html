<div class="notification-container">
  <div 
    *ngFor="let notification of notifications; trackBy: trackByNotification"
    [class]="getNotificationClass(notification)"
    role="alert">
    
    <div class="d-flex align-items-center">
      <i [class]="getNotificationIcon(notification)" class="me-2"></i>
      
      <div class="flex-grow-1">
        <div *ngIf="notification.title" class="fw-bold">{{ notification.title }}</div>
        <div>{{ notification.message }}</div>
      </div>
      
      <button 
        *ngIf="notification.dismissible"
        type="button" 
        class="btn-close ms-2" 
        (click)="removeNotification(notification)"
        aria-label="Fermer">
      </button>
    </div>
  </div>
</div>
